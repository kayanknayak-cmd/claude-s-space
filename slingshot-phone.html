<title>Slingshot</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="A gravity game for your phone. Throw a comet past stars and moons and collect every target.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,300;1,400;1,500&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a portrait arena that fills the phone, a thin top bar with the two
   controls you need mid-level, and full-screen sheets for everything else.
   Type: two faces with fixed jobs. Cormorant Garamond italic for names and words
   (levels, worlds, the title), IBM Plex Mono for numbers and small spaced labels.
   Controls are hairline glyphs lit like the sky, with no boxes around them. */
:root{
  color-scheme:dark;
  --ink:#05060c; --paper:#efe8da; --mist:#9b98aa; --line:rgba(239,232,218,.14);
  --glass:rgba(8,9,16,.72); --accent:#9ad7ff; --hot:#ffd36e;
  --display:"Cormorant Garamond",Garamond,"Times New Roman",serif;
  --body:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --top:env(safe-area-inset-top,0px); --bot:env(safe-area-inset-bottom,0px);
}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--paper);font:400 14px/1.5 var(--body);overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;overscroll-behavior:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#fx{pointer-events:none}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

/* top bar */
.bar{position:fixed;left:0;right:0;top:0;padding:calc(var(--top) + 10px) max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px));
  display:flex;justify-content:center;pointer-events:none}
.bar>*{pointer-events:auto}
.round{appearance:none;width:52px;height:52px;border:0;background:none;padding:0;display:grid;place-items:center;cursor:pointer;color:var(--paper);
  opacity:.8;filter:drop-shadow(0 0 5px color-mix(in srgb,var(--accent) 60%,transparent));transition:opacity .2s,color .2s}
.round:active{transform:scale(.92);opacity:1}
.round svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
.round svg .dot{fill:currentColor;stroke:none}
.mid{appearance:none;border:0;background:none;color:inherit;padding:6px 18px 10px;cursor:pointer;display:grid;justify-items:center;gap:6px;text-align:center;min-width:0;max-width:100%}
.lvname{display:block;font:400 italic 22px/1 var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.pips{display:flex;gap:7px;align-items:center}
.pip{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--pc,var(--accent));opacity:.85}
.pip.on{background:var(--pc,var(--accent));box-shadow:0 0 10px var(--pc,var(--accent))}
.shots{font:400 12px/1 var(--mono);color:var(--mist);margin-left:4px}
.corner{position:fixed;right:max(8px,env(safe-area-inset-right,0px));bottom:calc(var(--bot) + 12px);display:flex;gap:0}
.speed{width:auto;min-width:52px;padding:0 8px;font:400 16px/1 var(--mono);letter-spacing:.04em;display:flex;align-items:center;justify-content:center}
.skip{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--bot) + 72px);appearance:none;border:0;background:none;color:var(--paper);
  padding:10px 14px;font:400 italic 19px/1 var(--display);cursor:pointer;opacity:.8;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:5px}
.ff{position:fixed;left:50%;top:calc(var(--top) + 78px);transform:translateX(-50%);display:flex;gap:2px;pointer-events:none}
.ff i{width:0;height:0;border-left:9px solid var(--accent);border-top:6px solid transparent;border-bottom:6px solid transparent;animation:ffc .8s linear infinite}
.ff i:nth-child(2){animation-delay:.13s}.ff i:nth-child(3){animation-delay:.26s}
@keyframes ffc{0%,100%{opacity:.2}40%{opacity:1}}
.replay{position:fixed;left:50%;top:calc(var(--top) + 76px);transform:translateX(-50%);font:500 10px/1 var(--mono);letter-spacing:.3em;text-transform:uppercase;
  color:var(--hot);text-shadow:0 0 8px rgba(255,211,110,.6)}

/* sheets */
.sheet{position:fixed;inset:0;background:rgba(4,5,10,.82);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
  overflow-y:auto;padding:calc(var(--top) + 18px) max(18px,env(safe-area-inset-right,0px)) calc(var(--bot) + 28px) max(18px,env(safe-area-inset-left,0px));
  animation:fade .25s ease both;touch-action:pan-y}
@keyframes fade{from{opacity:0}}
.sheet-in{max-width:30rem;margin:0 auto;display:grid;gap:22px}
.sh-head{display:flex;justify-content:space-between;align-items:center}
.brand{font:400 12px/1 var(--mono);letter-spacing:.12em;color:var(--mist)}
.brand b{color:var(--paper);font-weight:500}
h1{margin:0;font:300 italic 54px/1 var(--display)}
h2{margin:0 0 10px;font:500 10px/1 var(--mono);letter-spacing:.3em;text-transform:uppercase;color:var(--mist);display:flex;justify-content:space-between}
h2 span{letter-spacing:0;text-transform:none;font-family:var(--mono)}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.tile{appearance:none;aspect-ratio:1;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.03);cursor:pointer;
  display:grid;place-items:center;align-content:center;gap:3px;font:500 19px/1 var(--mono)}
.tile small{font:400 10px/1 var(--mono);letter-spacing:.08em;color:var(--hot)}
.today{appearance:none;width:100%;min-height:64px;padding:0 20px;border-radius:18px;border:1px solid color-mix(in srgb,var(--dc) 45%,transparent);
  background:linear-gradient(100deg,color-mix(in srgb,var(--dc) 14%,transparent),rgba(255,255,255,.02));cursor:pointer;color:inherit;
  display:flex;align-items:center;justify-content:space-between;font:400 italic 22px/1 var(--display,serif)}
.today small{font:400 12px/1 var(--mono);font-style:normal;color:var(--hot)}
.tile.cur{border-color:var(--wc,var(--accent));box-shadow:inset 0 0 0 1px var(--wc,var(--accent))}
.tile:disabled{opacity:.3;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:10px}
.pill{appearance:none;min-height:46px;padding:0 18px;border-radius:23px;border:1px solid var(--line);background:rgba(255,255,255,.03);cursor:pointer;font:400 13px/1 var(--mono);letter-spacing:.04em}
.pill[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,transparent)}
.muted{color:var(--mist);font:400 italic 18px/1.4 var(--display);margin:0}
a{color:var(--accent)}


.lvname,.pips{transition:opacity .5s ease}
body.titling .lvname,body.titling .pips{opacity:0}
/* after a win: a row of quiet icons instead of a panel */
/* after a win: ringed controls, each with a small spaced label; Next is the lit one */
.winbar{position:fixed;left:0;right:0;bottom:calc(var(--bot) + 34px);display:flex;justify-content:center;align-items:flex-end;gap:20px;animation:fade .8s ease both}
.wb{appearance:none;border:0;background:none;color:var(--paper);padding:0;cursor:pointer;display:grid;justify-items:center;gap:9px}
.wb .ic{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;box-shadow:inset 0 0 0 1px rgba(255,246,230,.24);
  background:radial-gradient(circle at 50% 38%,rgba(255,246,230,.09),rgba(255,246,230,0) 68%);transition:box-shadow .2s,transform .15s}
.wb svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.wb .lb{font:500 9px/1 var(--mono);letter-spacing:.32em;text-transform:uppercase;color:var(--mist);padding-left:.32em}
.wb:active .ic{transform:scale(.93)}
.wb.go .ic{width:70px;height:70px;color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent),0 0 26px color-mix(in srgb,var(--accent) 35%,transparent);
  background:radial-gradient(circle at 50% 40%,color-mix(in srgb,var(--accent) 20%,transparent),transparent 70%)}
.wb.go svg{width:26px;height:26px;stroke-width:1.6}
.wb.go .lb{color:var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--bot) + 110px);font:400 italic 19px/1.3 var(--display);color:var(--paper);
  padding:8px 16px;border-radius:14px;background:rgba(5,6,12,.6);text-align:center;max-width:calc(100vw - 40px);text-shadow:0 0 10px rgba(5,6,12,.9)}
.toast button{appearance:none;border:0;background:none;color:var(--accent);font:inherit;text-decoration:underline;padding:4px;cursor:pointer}
.hintb{position:fixed;left:max(8px,env(safe-area-inset-left,0px));bottom:calc(var(--bot) + 12px)}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.ff i{animation:none}}
</style>

const Sound = {
  ctx: null, on: true, mute: false, rec: null,
  wake() {
    if (!this.ctx) { try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { this.ctx = null; } }
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
  },
  tone(f, dur = 0.7, type = 'sine', gain = 0.08, when = 0) {
    // while a highlight reel renders, sounds are noted with their time in the film and played into it later
    if (this.rec) { this.rec.list.push(['tone', [f, dur, type, gain], this.rec.at + when]); return; }
    if (!this.on || this.mute || !this.ctx) return;

    o.type = type; o.frequency.setValueAtTime(f, t);

    o.connect(g).connect(this.ctx.destination); o.start(t); o.stop(t + dur + 0.05);
  },
  whoosh(p, when = 0) {
    if (this.rec) { this.rec.list.push(['whoosh', [p], this.rec.at]); return; }
    if (!this.on || this.mute || !this.ctx) return;
    const c = this.ctx, t = c.currentTime + when, n = Math.floor(c.sampleRate * 0.45), buf = c.createBuffer(1, n, c.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2);
    const src = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    src.buffer = buf; f.type = 'bandpass'; f.Q.value = 1.4;
    f.frequency.setValueAtTime(300 + 900 * p, t); f.frequency.exponentialRampToValueAtTime(140, t + 0.45);
    g.gain.value = 0.05 + 0.08 * p; src.connect(f).connect(g).connect(c.destination); src.start(t);
  },
  chime(i) { const s = [523.25, 659.25, 783.99, 880, 1046.5, 1174.66, 1318.5]; const f = s[i % s.length]; this.tone(f, 1.2, 'sine', 0.07); this.tone(f * 2, 0.6, 'sine', 0.025); },
  trick() { this.tone(1567.98, 0.5, 'triangle', 0.03); this.tone(2093, 0.4, 'sine', 0.02, 0.06); },

/* ======================= physics ======================= */
// Shared by the game and the level checker, so a level proven solvable offline is solvable in play.
// Newtonian gravity with a little softening, integrated by leapfrog (kick,
// drift, kick) so orbits keep their energy. Black holes pull with the
// Paczynski-Wiita force m / (r - rs)^2, a one-line stand-in for general
// relativity that reproduces its precessing, zoom-whirl orbits. A star cluster is a Plummer sphere,
// potential -m / sqrt(r^2 + a^2): a comet can fly right through it, and its orbits precess into rosettes. Every level runs in fixed steps
// from its start, and moons advance by an exact rotation each step, so a
// throw replays bit for bit on any device. Only + - * / and sqrt appear in a step:
// those are the operations every device rounds the same way.
const EPS2 = 0.0004, DT = 1 / 600, TR = 0.09, STALE = 4.5;
function startPos(L) { return L.bodies.map(b => b.orbit ? [b.orbit.cx + b.orbit.ox, b.orbit.cy + b.orbit.oy] : [b.x, b.y]); }
function advance(L, P, Q) {
  for (let i = 0; i < L.bodies.length; i++) {
    const b = L.bodies[i];
    if (!b.orbit) { Q[i][0] = P[i][0]; Q[i][1] = P[i][1]; continue; }
    const o = b.orbit, dx = P[i][0] - o.cx, dy = P[i][1] - o.cy;
    Q[i][0] = o.cx + dx * o.c - dy * o.s; Q[i][1] = o.cy + dx * o.s + dy * o.c;
  }
}
function accel(B, P, x, y, out) {
  let ax = 0, ay = 0, hit = -1;
  for (let i = 0; i < B.length; i++) {
    const b = B[i], dx = P[i][0] - x, dy = P[i][1] - y, r2 = dx * dx + dy * dy;
    if (r2 < b.r * b.r) hit = i;
    let inv;
    if (b.rs) { const r = Math.sqrt(r2), q = Math.max(r - b.rs, 1e-3); inv = b.m / (r * q * q); }
    else { const e = r2 + (b.soft || EPS2); inv = b.m / (e * Math.sqrt(e)); }
    ax += dx * inv; ay += dy * inv;
  }
  out[0] = ax; out[1] = ay; out[2] = hit; return out;
}
const isMoon = b => b.orbit && !b.star;
function energy(B, P, x, y, vx, vy) {
  let pot = 0;
  for (let k = 0; k < B.length; k++) { const dx = P[k][0] - x, dy = P[k][1] - y, r2 = dx * dx + dy * dy, r = Math.sqrt(r2); pot -= B[k].m / (B[k].rs ? Math.max(r - B[k].rs, 1e-3) : B[k].soft ? Math.sqrt(r2 + B[k].soft) : r); }
  return 0.5 * (vx * vx + vy * vy) + pot;
}

/* ---- rubble: piles of rock held together by their own gravity ---- */
// Each rock is a small sphere. Rocks pull on one another, and touching spheres push apart with a stiff
// spring that loses a little energy each bounce (the spring-dashpot contact used to model sand and
// rubble piles). Rocks are far too light to bend a comet's path by gravity, but a comet that strikes
// them trades momentum through the same contact, so m1 v1 + m2 v2 is kept in every collision: a heavy
// comet ploughs through, a light one glances off.

  });

function newComet(W, vx, vy, kind) {

      p.x += p.vx * h; p.y += p.vy * h;

/* ---- throwing ---- */

  releaseTitle();

  const L = level(), [x, y] = L.launch, c = newComet(S.W, vx, vy, kind);
  Object.assign(c, { trail: [[x, y]], winds: L.bodies.map(() => 0), angs: L.bodies.map(() => null), close: false, moon: false, hits: 0,
    moving: L.bodies.some(b => b.orbit), E0: energy(L.bodies, S.P, x, y, vx, vy) });
  c.born = S.time;

/* ---- comet tails, formed the way real ones are ---- */

// velocity, and so lags into a curved gold tail. Luminosity grows as m^3.5 while gravity grows as m,
// so beta scales as m^2.5: heavy hot stars blow hardest. Black holes and moons give no light.
// The comet sheds faster as the starlight on it grows (flux ~ L / r^2), so tails flare near stars.

    let n = Math.min(5, 0.5 + flux * 0.7) * dt * 60;

      const j = () => (Math.random() - 0.5) * 0.04;
      S.dust.push({ x: c.x, y: c.y, vx: c.vx * 0.96 + j(), vy: c.vy * 0.96 + j(), beta: 0.15 + Math.random() * 0.95, ion: false, age: 0, life: 1.1 + Math.random() * 1.3 });

    }

/* ---- targets: Chladni plates ---- */
// Sand on a vibrating drumhead gathers where the plate stays still: the nodal lines of the mode

// Each plate rings in its own mode and its own color. They are drawn in the sky shader.

    S.sparks.push({ x: tx + Math.cos(a) * r, y: ty + Math.sin(a) * r, vx: Math.cos(a) * v + c.vx * 0.2, vy: Math.sin(a) * v + c.vy * 0.2, life: 1 + Math.random() * 1.3, age: 0, col: k % 4 ? o.hue : '#fff6e6' });

// A replay is the level plus the throws: on which step each was made and how hard.
const b36 = n => (n < 0 ? '-' : '') + Math.abs(n).toString(36);

const KCODE = ['n', 's', 'b', 'h'];
function replayCode() {
  const L = level();

    const a = [t, Math.round(vx * 1e5), Math.round(vy * 1e5)];
    if (kind && kind !== 'n') a.push(KCODE.indexOf(kind), act == null ? -1 : act);

}

    if (idx < 0) return null;
    if (fp(ALL[idx]) !== f) return { idx, throws: [] };
  } else { idx = parseInt(head, 10); if (!(idx >= 0 && idx < ALL.length)) return null; }
  const throws = code.slice(cut + 1).split('_').map(s => s.split('.').map(v => parseInt(v, 36))).filter(a => (a.length === 3 || a.length === 5) && a.every(Number.isFinite))
