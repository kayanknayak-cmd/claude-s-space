<title>Slingshot</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="A gravity game for your phone. Throw a comet past stars and moons and collect every target.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,300;1,400;1,500&family=Jost:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a portrait arena that fills the phone, a thin top bar with the two
   controls you need mid-level, and full-screen sheets for everything else. */
:root{
  color-scheme:dark;
  --ink:#05060c; --paper:#efe8da; --mist:#9b98aa; --line:rgba(239,232,218,.14);
  --glass:rgba(8,9,16,.72); --accent:#9ad7ff; --hot:#ffd36e;
  --display:"Cormorant Garamond",Garamond,"Times New Roman",serif;
  --body:"Jost","Avenir Next","Futura",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --top:env(safe-area-inset-top,0px); --bot:env(safe-area-inset-bottom,0px);
}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--paper);font:400 16px/1.4 var(--body);overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;overscroll-behavior:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#fx{pointer-events:none}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

/* top bar */
.bar{position:fixed;left:0;right:0;top:0;padding:calc(var(--top) + 10px) max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px));
  display:grid;grid-template-columns:56px 1fr 56px;align-items:center;gap:8px;pointer-events:none}
.bar>*{pointer-events:auto}
.round{appearance:none;width:52px;height:52px;border-radius:50%;border:1px solid var(--line);background:var(--glass);
  display:grid;place-items:center;cursor:pointer;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.round:active{transform:scale(.94)}
.round svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.mid{display:grid;justify-items:center;gap:6px;pointer-events:none;text-align:center;min-width:0}
.lvname{font:400 italic 22px/1 var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.pips{display:flex;gap:7px;align-items:center}
.pip{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--pc,var(--accent));opacity:.85}
.pip.on{background:var(--pc,var(--accent));box-shadow:0 0 10px var(--pc,var(--accent))}
.shots{font:400 12px/1 var(--mono);color:var(--mist);margin-left:4px}
.corner{position:fixed;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(var(--bot) + 16px);display:flex;gap:10px}
.speed{width:auto;padding:0 16px;border-radius:26px;font:500 15px/1 var(--mono);gap:6px;display:flex;align-items:center}
.skip{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--bot) + 22px);appearance:none;border:1px solid var(--line);
  background:var(--glass);border-radius:22px;padding:11px 18px;font-size:15px;cursor:pointer;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.ff{position:fixed;left:50%;top:calc(var(--top) + 78px);transform:translateX(-50%);display:flex;gap:2px;pointer-events:none}
.ff i{width:0;height:0;border-left:9px solid var(--accent);border-top:6px solid transparent;border-bottom:6px solid transparent;animation:ffc .8s linear infinite}
.ff i:nth-child(2){animation-delay:.13s}.ff i:nth-child(3){animation-delay:.26s}
@keyframes ffc{0%,100%{opacity:.2}40%{opacity:1}}
.replay{position:fixed;left:50%;top:calc(var(--top) + 76px);transform:translateX(-50%);font:500 11px/1 var(--body);letter-spacing:.22em;text-transform:uppercase;
  color:var(--hot);padding:7px 12px;border-radius:14px;border:1px solid rgba(255,211,110,.4);background:var(--glass)}

/* sheets */
.sheet{position:fixed;inset:0;background:rgba(4,5,10,.82);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
  overflow-y:auto;padding:calc(var(--top) + 18px) max(18px,env(safe-area-inset-right,0px)) calc(var(--bot) + 28px) max(18px,env(safe-area-inset-left,0px));
  animation:fade .25s ease both;touch-action:pan-y}
@keyframes fade{from{opacity:0}}
.sheet-in{max-width:30rem;margin:0 auto;display:grid;gap:22px}
.sh-head{display:flex;justify-content:space-between;align-items:center}
.brand{font:500 14px/1 var(--body);letter-spacing:.06em;color:var(--mist)}
.brand b{color:var(--paper);font-weight:500}
h1{margin:0;font:300 italic 54px/1 var(--display)}
h2{margin:0 0 10px;font:500 11px/1 var(--body);letter-spacing:.24em;text-transform:uppercase;color:var(--mist);display:flex;justify-content:space-between}
h2 span{letter-spacing:0;text-transform:none;font-family:var(--mono)}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.tile{appearance:none;aspect-ratio:1;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.03);cursor:pointer;
  display:grid;place-items:center;align-content:center;gap:3px;font:500 19px/1 var(--mono)}
.tile small{font:400 10px/1 var(--body);letter-spacing:.08em;color:var(--hot)}
.tile.cur{border-color:var(--wc,var(--accent));box-shadow:inset 0 0 0 1px var(--wc,var(--accent))}
.tile:disabled{opacity:.3;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:10px}
.pill{appearance:none;min-height:46px;padding:0 18px;border-radius:23px;border:1px solid var(--line);background:rgba(255,255,255,.03);cursor:pointer;font-size:15px}
.pill[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,transparent)}
.big{appearance:none;width:100%;min-height:58px;border-radius:29px;border:0;background:var(--accent);color:#08101a;font:500 18px/1 var(--body);cursor:pointer}
.ghost{appearance:none;min-height:52px;flex:1;border-radius:26px;border:1px solid var(--line);background:rgba(255,255,255,.04);font-size:16px;cursor:pointer}
.muted{color:var(--mist);font-size:14px;margin:0}
a{color:var(--accent)}

/* the level-complete sheet */
.win{place-items:center;text-align:center}
.win .sheet-in{align-content:center;min-height:100%;gap:18px}
.stars{font-size:44px;letter-spacing:.18em;color:var(--hot);text-shadow:0 0 18px rgba(255,211,110,.5)}
.score{font:500 34px/1 var(--mono)}
.tricks{display:grid;gap:8px;font-size:15px}
.tricks div{display:flex;justify-content:space-between;gap:12px;padding:10px 14px;border-radius:12px;background:rgba(255,255,255,.04)}
.tricks b{font-family:var(--mono);font-weight:500;color:var(--hot)}
.note{font:400 13px/1.3 var(--mono);color:var(--mist);min-height:1.3em}

/* level title card: rises in at the centre, holds, then flies up into the top bar */
.intro{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);display:grid;justify-items:center;gap:10px;text-align:center;
  pointer-events:none;width:min(90vw,26rem);transition:transform .75s cubic-bezier(.65,0,.25,1),opacity .6s ease .1s}
.intro .iw{font:500 11px/1 var(--body);letter-spacing:.3em;text-transform:uppercase;color:var(--accent)}
.intro .in{font:300 italic clamp(46px,13vw,68px)/1 var(--display);text-shadow:0 0 30px rgba(5,6,12,.9)}
.intro .ip{font:400 14px/1 var(--mono);color:var(--mist);letter-spacing:.08em}
.intro .rule{width:0;height:1px;background:var(--accent);animation:rule .9s cubic-bezier(.2,.7,.2,1) .15s forwards}
.intro.show>*{animation:rise .7s cubic-bezier(.2,.7,.2,1) both}
.intro.show .in{animation-delay:.08s}.intro.show .ip{animation-delay:.22s}
.intro.show .rule{animation:rule .9s cubic-bezier(.2,.7,.2,1) .15s forwards}
.intro.fly{transform:translate(-50%,calc(-40vh + var(--top) + 20px)) scale(.38);opacity:0}
@keyframes rise{from{opacity:0;transform:translateY(14px);filter:blur(4px)}}
@keyframes rule{to{width:120px}}
.lvname,.pips{transition:opacity .5s ease}
body.titling .lvname,body.titling .pips{opacity:0}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.ff i{animation:none}}
</style>

</div>

const Sound = {
  ctx: null, on: true,
  wake() {
    if (!this.ctx) { try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { this.ctx = null; } }
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
  },
  tone(f, dur = 0.7, type = 'sine', gain = 0.08, when = 0) {
    if (!this.on || !this.ctx) return;
    const t = this.ctx.currentTime + when, o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(gain, t + 0.012); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(this.ctx.destination); o.start(t); o.stop(t + dur + 0.05);
  },
  whoosh(p) {
    if (!this.on || !this.ctx) return;
    const c = this.ctx, t = c.currentTime, n = Math.floor(c.sampleRate * 0.45), buf = c.createBuffer(1, n, c.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2);
    const src = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    src.buffer = buf; f.type = 'bandpass'; f.Q.value = 1.4;
    f.frequency.setValueAtTime(300 + 900 * p, t); f.frequency.exponentialRampToValueAtTime(140, t + 0.45);
    g.gain.value = 0.05 + 0.08 * p; src.connect(f).connect(g).connect(c.destination); src.start(t);
  },
  chime(i) { const s = [523.25, 659.25, 783.99, 880, 1046.5, 1174.66, 1318.5]; const f = s[i % s.length]; this.tone(f, 1.2, 'sine', 0.07); this.tone(f * 2, 0.6, 'sine', 0.025); },
  trick() { this.tone(1567.98, 0.5, 'triangle', 0.03); this.tone(2093, 0.4, 'sine', 0.02, 0.06); },
  thud() { this.tone(70, 0.5, 'sine', 0.14); this.tone(140, 0.25, 'triangle', 0.04); },
  fanfare() { [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach((f, i) => { this.tone(f, 1.5, 'sine', 0.06, i * 0.1); this.tone(f / 2, 1.5, 'triangle', 0.02, i * 0.1); }); },
};

// Plain Newtonian gravity with a little softening, integrated by leapfrog
// (kick, drift, kick), which keeps orbits from drifting. Fixed steps from the
// start of each level make every throw exactly repeatable, so replays work.
const EPS2 = 0.0004, DT = 1 / 600, PULL = 0.75, SPEED = 2.6, TR = 0.075, STALE = 4.5, FF = 14;
function bodyPos(b, t) {
  if (!b.orbit) return [b.x, b.y];
  const o = b.orbit, a = o.phase + t / o.period * Math.PI * 2;
  return [o.cx + o.R * Math.cos(a), o.cy + o.R * Math.sin(a)];
}
function accel(B, x, y, t, out) {
  let ax = 0, ay = 0, hit = -1;
  for (let i = 0; i < B.length; i++) {
    const b = B[i], p = bodyPos(b, t), dx = p[0] - x, dy = p[1] - y, r2 = dx * dx + dy * dy;
    if (r2 < b.r * b.r) hit = i;
    const e = r2 + EPS2, inv = b.m / (e * Math.sqrt(e));
    ax += dx * inv; ay += dy * inv;
  }
  out[0] = ax; out[1] = ay; out[2] = hit; return out;
}

    g.beginPath(); g.arc(lx, ly, 22, -Math.PI / 2, -Math.PI / 2 + pw * Math.PI * 2); g.stroke();
    g.strokeStyle = 'rgba(239,232,218,.35)'; g.lineWidth = 1.2; g.beginPath(); g.moveTo(A.sx, A.sy); g.lineTo(A.cx, A.cy); g.stroke();
    g.fillStyle = 'rgba(239,232,218,.5)'; g.beginPath(); g.arc(A.cx, A.cy, 16, 0, 7); g.fill();
  }
  // trick labels drift up slowly and fade
  g.font = '500 15px "IBM Plex Mono", ui-monospace, monospace'; g.textAlign = 'center';
  for (const l of S.labels) {
    const [sx, sy] = toScr(l.x, l.y), a = l.age < 0.2 ? l.age / 0.2 : 1 - Math.max(0, l.age - 1.1) / 0.7;
    g.fillStyle = `rgba(255,211,110,${a})`; g.fillText(l.text, sx, sy - 26 - l.age * 22);
  }
  g.textAlign = 'start';
}

/* ======================= input ======================= */
let pointer = null;
cvs.addEventListener('contextmenu', e => e.preventDefault());
cvs.addEventListener('pointerdown', e => {
  Sound.wake();
  titleAway();
  if (S.won || S.replay || pointer) return;
  cvs.setPointerCapture(e.pointerId);
  pointer = e.pointerId;
  S.aim = { sx: e.clientX, sy: e.clientY, cx: e.clientX, cy: e.clientY, v: [0, 0], path: [] };
});
cvs.addEventListener('pointermove', e => {
  if (e.pointerId !== pointer || !S.aim) return;
  const A = S.aim; A.cx = e.clientX; A.cy = e.clientY;
  // a drag of about 40% of the arena height is full power; pulling back throws forward
  const k = 0.55 / G.s;
  let px = -(A.cx - A.sx) * k, py = (A.cy - A.sy) * k;
  const l = Math.hypot(px, py); if (l > PULL) { px *= PULL / l; py *= PULL / l; }
  A.v = [px * SPEED, py * SPEED]; A.path = preview(A.v[0], A.v[1]);
});
const release = e => {
  if (e.pointerId !== pointer) return;
  pointer = null; const A = S.aim; S.aim = null;
  if (A && e.type === 'pointerup' && Math.hypot(A.v[0], A.v[1]) > 0.12) fire(A.v[0], A.v[1]);
};
cvs.addEventListener('pointerup', release); cvs.addEventListener('pointercancel', release);
document.addEventListener('gesturestart', e => e.preventDefault());
window.addEventListener('keydown', e => {
  if (e.key === 'r' || e.key === 'R') load(S.idx);
  if (e.key === 'n' || e.key === 'N') load(S.idx + 1);
});

/* ======================= buttons and sheets ======================= */
const SPEEDS = [1, 2, 4];
$('#speedBtn').onclick = () => { S.speed = SPEEDS[(SPEEDS.indexOf(S.speed) + 1) % SPEEDS.length]; $('#speedBtn').textContent = S.speed + '×'; };
$('#restartBtn').onclick = () => load(S.idx);
$('#skipBtn').onclick = () => { store.skipped = [...new Set([...(store.skipped || []), level().gid])]; save(); load(S.idx + 1); };
$('#menuBtn').onclick = () => { buildMenu(); $('#menu').hidden = false; };
$('#closeMenu').onclick = () => $('#menu').hidden = true;
$('#retryBtn').onclick = () => load(S.idx);
$('#nextBtn').onclick = () => { if (S.replay) load(S.idx); else load(S.idx === ALL.length - 1 ? 0 : S.idx + 1); };
function buildMenu() {
  const box = $('#worlds'); box.replaceChildren();
  let gi = 0;
  WORLDS.forEach(w => {
    const sec = document.createElement('div'), h = document.createElement('h2'), grid = document.createElement('div');
    const got = w.levels.reduce((s, _, i) => s + ((store.best[`${w.id}-${i}`] || {}).stars || 0), 0);
    h.innerHTML = '<span></span><span></span>'; h.firstChild.textContent = w.name; h.lastChild.textContent = `★ ${got}/${w.levels.length * 3}`;
    grid.className = 'grid'; grid.style.setProperty('--wc', w.theme.acc);
    w.levels.forEach((L, i) => {
      const idx = gi++, b = document.createElement('button'), best = store.best[`${w.id}-${i}`];
      b.type = 'button'; b.className = 'tile' + (idx === S.idx ? ' cur' : ''); b.disabled = !unlocked(idx);
      b.innerHTML = `${i + 1}<small>${best ? '★'.repeat(best.stars) : ''}</small>`;
      b.setAttribute('aria-label', `${w.name} level ${i + 1}, ${L.name}${best ? `, ${best.stars} stars` : ''}`);
      b.onclick = () => { $('#menu').hidden = true; load(idx); };
      grid.append(b);
    });
    sec.append(h, grid); box.append(sec);
  });
  const opt = (row, items, cur, on) => { const r = $(row); r.replaceChildren(); items.forEach(([id, name]) => { const b = document.createElement('button'); b.type = 'button'; b.className = 'pill'; b.textContent = name; b.setAttribute('aria-pressed', String(id === cur)); b.onclick = () => { on(id); buildMenu(); }; r.append(b); }); };
  opt('#soundRow', [[true, 'On'], [false, 'Off']], Sound.on, v => { Sound.on = store.sound = v; save(); if (v) Sound.wake(); });
}

/* ======================= replays ======================= */
// A replay is just the level and the throws: when each was made and how hard.
// Physics is deterministic, so the link replays the exact same flight.
const b36 = n => (n < 0 ? '-' : '') + Math.abs(n).toString(36);
function replayCode() { return `${S.idx}.` + S.throws.map(([t, vx, vy]) => [t, Math.round(vx * 1e5), Math.round(vy * 1e5)].map(b36).join('.')).join('_'); }
function parseReplay(code) {
  const [i, rest] = [code.slice(0, code.indexOf('.')), code.slice(code.indexOf('.') + 1)];
  const idx = parseInt(i, 10); if (!(idx >= 0 && idx < ALL.length)) return null;
  const throws = rest.split('_').map(s => s.split('.').map(v => parseInt(v, 36))).filter(a => a.length === 3 && a.every(Number.isFinite)).map(([t, x, y]) => [t, x / 1e5, y / 1e5]);
  return throws.length ? { idx, throws } : null;
}
$('#shareBtn').onclick = async () => {
  const base = /areabake\.com$/.test(location.hostname) ? location.origin + location.pathname : 'https://areabake.com/phone';
  const url = `${base}#r=${replayCode()}`, L = level();
  const text = `Slingshot, ${world().name} ${L.li + 1}: ${'★'.repeat(stars())} ${S.score.toLocaleString('en-US')} points. Watch my throw:`;
  try {
    if (navigator.share) { await navigator.share({ title: 'Slingshot', text, url }); return; }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  try { await navigator.clipboard.writeText(`${text} ${url}`); $('#shareNote').textContent = 'Link copied.'; }
  catch (e) { $('#shareNote').textContent = url; }
};

/* ======================= loop ======================= */
let last = performance.now();
function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, Math.max(0.001, (now - last) / 1000)); last = now;
  if (document.hidden) return;
  S.time += dt;
  simulate(dt); renderGL(); draw();
  if (S.replay && !S.won && !S.comets.length && S.replay.throws.every(q => q.done)) load(S.idx);
}
window.addEventListener('resize', resize);
resize();
const m = /#r=([0-9a-z._-]+)/.exec(location.hash), rp = m && parseReplay(m[1]);
if (rp) load(rp.idx, { throws: rp.throws }); else load(Math.min(store.last || 0, ALL.length - 1));
if (!gl) document.body.insertAdjacentHTML('beforeend', '<p style="position:fixed;bottom:40%;left:0;right:0;text-align:center">This game needs WebGL 2, which this browser has turned off.</p>');
requestAnimationFrame(loop);
</script>
