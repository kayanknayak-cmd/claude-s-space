<title>Slingshot</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="A gravity game for your phone. Throw a comet past stars and moons and collect every target.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,300;1,400;1,500&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a portrait arena that fills the phone, a thin top bar with the two
   controls you need mid-level, and full-screen sheets for everything else.
   Type: two faces with fixed jobs. Cormorant Garamond italic for names and words
   (levels, worlds, the title), IBM Plex Mono for numbers and small spaced labels.
   Controls are hairline glyphs lit like the sky, with no boxes around them. */
:root{
  color-scheme:dark;
  --ink:#05060c; --paper:#efe8da; --mist:#9b98aa; --line:rgba(239,232,218,.14);
  --glass:rgba(8,9,16,.72); --accent:#9ad7ff; --hot:#ffd36e;
  --display:"Cormorant Garamond",Garamond,"Times New Roman",serif;
  --body:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --top:env(safe-area-inset-top,0px); --bot:env(safe-area-inset-bottom,0px);
}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--paper);font:400 14px/1.5 var(--body);overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;overscroll-behavior:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#fx{pointer-events:none}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

/* top bar */
.bar{position:fixed;left:0;right:0;top:0;padding:calc(var(--top) + 10px) max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px));
  display:grid;grid-template-columns:56px 1fr 56px;align-items:center;gap:8px;pointer-events:none}
.bar>*{pointer-events:auto}
.round{appearance:none;width:52px;height:52px;border:0;background:none;padding:0;display:grid;place-items:center;cursor:pointer;color:var(--paper);
  opacity:.8;filter:drop-shadow(0 0 5px color-mix(in srgb,var(--accent) 60%,transparent));transition:opacity .2s,color .2s}
.round:active{transform:scale(.92);opacity:1}
.round svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
.round svg .dot{fill:currentColor;stroke:none}
.mid{display:grid;justify-items:center;gap:6px;pointer-events:none;text-align:center;min-width:0}
.lvname{font:400 italic 22px/1 var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.pips{display:flex;gap:7px;align-items:center}
.pip{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--pc,var(--accent));opacity:.85}
.pip.on{background:var(--pc,var(--accent));box-shadow:0 0 10px var(--pc,var(--accent))}
.shots{font:400 12px/1 var(--mono);color:var(--mist);margin-left:4px}
.corner{position:fixed;right:max(8px,env(safe-area-inset-right,0px));bottom:calc(var(--bot) + 12px);display:flex;gap:0}
.speed{width:auto;min-width:52px;padding:0 8px;font:400 16px/1 var(--mono);letter-spacing:.04em;display:flex;align-items:center;justify-content:center}
.skip{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--bot) + 72px);appearance:none;border:0;background:none;color:var(--paper);
  padding:10px 14px;font:400 italic 19px/1 var(--display);cursor:pointer;opacity:.8;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:5px}
.ff{position:fixed;left:50%;top:calc(var(--top) + 78px);transform:translateX(-50%);display:flex;gap:2px;pointer-events:none}
.ff i{width:0;height:0;border-left:9px solid var(--accent);border-top:6px solid transparent;border-bottom:6px solid transparent;animation:ffc .8s linear infinite}
.ff i:nth-child(2){animation-delay:.13s}.ff i:nth-child(3){animation-delay:.26s}
@keyframes ffc{0%,100%{opacity:.2}40%{opacity:1}}
.replay{position:fixed;left:50%;top:calc(var(--top) + 76px);transform:translateX(-50%);font:500 10px/1 var(--mono);letter-spacing:.3em;text-transform:uppercase;
  color:var(--hot);text-shadow:0 0 8px rgba(255,211,110,.6)}

/* sheets */
.sheet{position:fixed;inset:0;background:rgba(4,5,10,.82);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
  overflow-y:auto;padding:calc(var(--top) + 18px) max(18px,env(safe-area-inset-right,0px)) calc(var(--bot) + 28px) max(18px,env(safe-area-inset-left,0px));
  animation:fade .25s ease both;touch-action:pan-y}
@keyframes fade{from{opacity:0}}
.sheet-in{max-width:30rem;margin:0 auto;display:grid;gap:22px}
.sh-head{display:flex;justify-content:space-between;align-items:center}
.brand{font:400 12px/1 var(--mono);letter-spacing:.12em;color:var(--mist)}
.brand b{color:var(--paper);font-weight:500}
h1{margin:0;font:300 italic 54px/1 var(--display)}
h2{margin:0 0 10px;font:500 10px/1 var(--mono);letter-spacing:.3em;text-transform:uppercase;color:var(--mist);display:flex;justify-content:space-between}
h2 span{letter-spacing:0;text-transform:none;font-family:var(--mono)}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.tile{appearance:none;aspect-ratio:1;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.03);cursor:pointer;
  display:grid;place-items:center;align-content:center;gap:3px;font:500 19px/1 var(--mono)}
.tile small{font:400 10px/1 var(--mono);letter-spacing:.08em;color:var(--hot)}
.today{appearance:none;width:100%;min-height:64px;padding:0 20px;border-radius:18px;border:1px solid color-mix(in srgb,var(--dc) 45%,transparent);
  background:linear-gradient(100deg,color-mix(in srgb,var(--dc) 14%,transparent),rgba(255,255,255,.02));cursor:pointer;color:inherit;
  display:flex;align-items:center;justify-content:space-between;font:400 italic 22px/1 var(--display,serif)}
.today small{font:400 12px/1 var(--mono);font-style:normal;color:var(--hot)}
.tile.cur{border-color:var(--wc,var(--accent));box-shadow:inset 0 0 0 1px var(--wc,var(--accent))}
.tile:disabled{opacity:.3;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:10px}
.pill{appearance:none;min-height:46px;padding:0 18px;border-radius:23px;border:1px solid var(--line);background:rgba(255,255,255,.03);cursor:pointer;font:400 13px/1 var(--mono);letter-spacing:.04em}
.pill[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,transparent)}
.muted{color:var(--mist);font:400 italic 18px/1.4 var(--display);margin:0}
a{color:var(--accent)}


.lvname,.pips{transition:opacity .5s ease}
body.titling .lvname,body.titling .pips{opacity:0}
/* after a win: a row of quiet icons instead of a panel */
.winbar{position:fixed;left:0;right:0;bottom:calc(var(--bot) + 22px);display:flex;justify-content:center;align-items:center;gap:14px;animation:fade .5s ease both}
.winbar .round{width:56px;height:56px}
/* the way on: a lit ring, like the photon ring around a black hole */
.winbar .go{width:74px;height:74px;border-radius:50%;color:var(--accent);opacity:1;box-shadow:inset 0 0 0 1px var(--accent),0 0 18px color-mix(in srgb,var(--accent) 45%,transparent);
  background:radial-gradient(circle,color-mix(in srgb,var(--accent) 16%,transparent),transparent 70%)}
.winbar .go svg{width:28px;height:28px;stroke-width:1.5}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--bot) + 110px);font:400 italic 19px/1.3 var(--display);color:var(--paper);
  padding:8px 16px;border-radius:14px;background:rgba(5,6,12,.6);text-align:center;max-width:calc(100vw - 40px);text-shadow:0 0 10px rgba(5,6,12,.9)}
.toast button{appearance:none;border:0;background:none;color:var(--accent);font:inherit;text-decoration:underline;padding:4px;cursor:pointer}
.hintb{position:fixed;left:max(8px,env(safe-area-inset-left,0px));bottom:calc(var(--bot) + 12px)}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.ff i{animation:none}}
</style>

/* ---- comet tails, formed the way real ones are ---- */

    b.lastChild.textContent = (done ? '★'.repeat(done) : `No. ${L.li + 1}`) + (sk > 1 ? ` · ${sk} days` : '');
    b.onclick = () => { $('#menu').hidden = true; load(ti); };
    box.append(b);
  }
  let gi = 0;
  WORLDS.forEach(w => {
    if (w.daily) return;
    const sec = document.createElement('div'), h = document.createElement('h2'), grid = document.createElement('div');
    const got = w.levels.reduce((s, _, i) => s + ((store.best[`${w.id}-${i}`] || {}).stars || 0), 0);
    h.innerHTML = '<span></span><span></span>'; h.firstChild.textContent = w.name; h.lastChild.textContent = `★ ${got}/${w.levels.length * 3}`;
    grid.className = 'grid'; grid.style.setProperty('--wc', w.theme.acc);
    w.levels.forEach((L, i) => {
      const idx = gi++, b = document.createElement('button'), best = store.best[`${w.id}-${i}`];
      b.type = 'button'; b.className = 'tile' + (idx === S.idx ? ' cur' : ''); b.disabled = !unlocked(idx);
      b.innerHTML = `${i + 1}<small>${best ? '★'.repeat(best.stars) : ''}</small>`;
      b.setAttribute('aria-label', `${w.name} level ${i + 1}, ${L.name}${best ? `, ${best.stars} stars` : ''}`);
      b.onclick = () => { $('#menu').hidden = true; load(idx); };
      grid.append(b);
    });
    sec.append(h, grid); box.append(sec);
  });
  const r = $('#soundRow'); r.replaceChildren();
  [[true, 'On'], [false, 'Off']].forEach(([id, name]) => { const b = document.createElement('button'); b.type = 'button'; b.className = 'pill'; b.textContent = name; b.setAttribute('aria-pressed', String(id === Sound.on)); b.onclick = () => { Sound.on = store.sound = id; save(); if (id) Sound.wake(); buildMenu(); }; r.append(b); });
}

/* ======================= replays ======================= */
// A replay is the level plus the throws: on which step each was made and how hard.
const b36 = n => (n < 0 ? '-' : '') + Math.abs(n).toString(36);
// Links name the level by id and fingerprint rather than position, so adding levels never breaks them.
const KCODE = ['n', 's', 'b', 'h'];
function replayCode() {
  const L = level();
  return `${L.gid}~${fp(L)}.` + S.throws.map(([t, vx, vy, kind, act]) => {
    const a = [t, Math.round(vx * 1e5), Math.round(vy * 1e5)];
    if (kind && kind !== 'n') a.push(KCODE.indexOf(kind), act == null ? -1 : act);
    return a.map(b36).join('.');
  }).join('_');
}
function parseReplay(code) {
  const cut = code.indexOf('.'), head = code.slice(0, cut);
  let idx;
  if (head.includes('~')) {
    const [gid, f] = head.split('~'); idx = ALL.findIndex(L => L.gid === gid);
    if (idx < 0) return null;
    if (fp(ALL[idx]) !== f) return { idx, throws: [] };
  } else { idx = parseInt(head, 10); if (!(idx >= 0 && idx < ALL.length)) return null; }
  const throws = code.slice(cut + 1).split('_').map(s => s.split('.').map(v => parseInt(v, 36))).filter(a => (a.length === 3 || a.length === 5) && a.every(Number.isFinite))
    .map(([t, x, y, k, act]) => k == null ? [t, x / 1e5, y / 1e5] : [t, x / 1e5, y / 1e5, KCODE[k] || 'n', act]);
  return { idx, throws };
}
$('#shareBtn').onclick = async () => {
  const base = ON_SITE ? location.origin + '/phone' : 'https://areabake.com/phone';
  const url = `${base}#r=${replayCode()}`, L = level();
  const text = `Slingshot, ${world().daily ? "today's sky" : world().name} ${L.li + 1}: ${'★'.repeat(stars())} ${S.score.toLocaleString('en-US')} points. Watch my throw:`;
  try { if (navigator.share) { await navigator.share({ title: 'Slingshot', text, url }); return; } } catch (e) { if (e && e.name === 'AbortError') return; }
  try { await navigator.clipboard.writeText(`${text} ${url}`); toast('Link copied', 2500); } catch (e) { toast(url); }
};

/* ======================= video clips ======================= */
// The run is replayed from its first step and rendered frame by frame into a
// vertical 1080 x 1920 video, so nothing has to be recording while you play.
let muxer = null;
function loadMuxer() {
  if (window.Mp4Muxer) return Promise.resolve(window.Mp4Muxer);
  return muxer || (muxer = new Promise((ok, no) => {
    const sc = document.createElement('script'); sc.src = 'https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/build/mp4-muxer.min.js';
    sc.onload = () => ok(window.Mp4Muxer); sc.onerror = () => { muxer = null; no(new Error('load')); }; document.head.append(sc);
  }));
}
async function makeClip() {
  if (CLIP) return;
  if (!('VideoEncoder' in window)) { stillShot(); return; }
  const vw = 1080, vh = 1920, fps = 60;
  // H.264 plays everywhere; VP9 is the fallback where H.264 encoding is missing
  let cfg = null, kind = 'avc';
  for (const [codec, k] of [['avc1.64002a', 'avc'], ['avc1.640028', 'avc'], ['avc1.4d002a', 'avc'], ['avc1.42002a', 'avc'], ['vp09.00.40.08', 'vp9']]) {
    const c = { codec, width: vw, height: vh, bitrate: 14e6, framerate: fps, ...(k === 'avc' ? { avc: { format: 'avc' } } : {}) };
    try { if ((await VideoEncoder.isConfigSupported(c)).supported) { cfg = c; kind = k; break; } } catch (e) {}
  }
  if (!cfg) { stillShot(); return; }
  let M; try { M = await loadMuxer(); } catch (e) { toast('Could not load the video tools. Check your connection.', 3500); return; }
  const mux = new M.Muxer({ target: new M.ArrayBufferTarget(), video: { codec: kind, width: vw, height: vh, frameRate: fps }, fastStart: 'in-memory' });
  let failed = null;
  const enc = new VideoEncoder({ output: (ch, meta) => mux.addVideoChunk(ch, meta), error: e => failed = e });
  enc.configure(cfg);
  // set the game aside, render the replay at clip size, then put everything back
  const keep = { S: { ...S }, DPR, W, H, cssW, cssH, G };
  CLIP = true; Sound.mute = true;
  DPR = 2; cssW = vw / 2; cssH = vh / 2; W = vw; H = vh; cvs.width = fx.width = W; cvs.height = fx.height = H; geom();
  const out = document.createElement('canvas'); out.width = vw; out.height = vh; const oc = out.getContext('2d');
  S.time = 0;
  load(keep.S.idx, { throws: keep.S.throws.map(q => q.slice()) });
  const btn = $('#clipBtn'); btn.disabled = true;
  try {
    for (let f = 0; f < fps * 75 && !failed; f++) {
      S.time += 1 / fps; simulate(1 / fps); renderGL(); draw();
      oc.drawImage(cvs, 0, 0); oc.drawImage(fx, 0, 0);
      const vf = new VideoFrame(out, { timestamp: Math.round(f * 1e6 / fps), duration: Math.round(1e6 / fps) });
      enc.encode(vf, { keyFrame: f % 120 === 0 }); vf.close();
      while (enc.encodeQueueSize > 4) await new Promise(r => setTimeout(r, 2));
      if (f % 20 === 0) { toast(`Making your video ${Math.round(Math.min(1, S.won ? (S.time - S.wonAt) / 3 : S.time / 40) * 100)}%`); await new Promise(r => setTimeout(r, 0)); }
      if (S.won && S.time - S.wonAt > 3.2) break;
      if (!S.won && !S.comets.length && S.replay && S.replay.throws.every(q => q.done) && S.time > 2) break;
    }
    if (!failed) await enc.flush();
  } finally {
    try { enc.close(); } catch (e) {}
    CLIP = false; Sound.mute = false; btn.disabled = false;
    Object.assign(S, keep.S); DPR = keep.DPR; W = keep.W; H = keep.H; cssW = keep.cssW; cssH = keep.cssH; G = keep.G;
    cvs.width = fx.width = W; cvs.height = fx.height = H; resize();
    last = performance.now();
  }
  if (failed) { toast('The video encoder stopped. Try again.', 3500); return; }
  mux.finalize();
  const L = level(), name = `slingshot-${world().id}-${L.li + 1}.mp4`, blob = new Blob([mux.target.buffer], { type: 'video/mp4' });
  const file = new File([blob], name, { type: 'video/mp4' });
  // sharing needs a fresh tap, so the finished video waits behind one
  const t = toast('Your video is ready. <button type="button">Share or save</button>');
  t.querySelector('button').onclick = () => shareFile(file, blob, name);
}
// where video can't be made, the finished sky as a picture instead
function stillShot() {
  renderGL(); draw();
  const out = document.createElement('canvas'); out.width = W; out.height = H; const oc = out.getContext('2d');
  oc.drawImage(cvs, 0, 0); oc.drawImage(fx, 0, 0);
  oc.font = `400 ${12 * DPR}px "IBM Plex Mono", ui-monospace, monospace`; oc.textAlign = 'center'; oc.fillStyle = 'rgba(239,232,218,.6)';
  oc.fillText('areabake.com/phone', W / 2, H - 26 * DPR);
  out.toBlob(blob => {
    if (!blob) { toast('Could not make a picture.', 3000); return; }
    const name = `slingshot-${world().id}-${level().li + 1}.png`, file = new File([blob], name, { type: 'image/png' });
    const t = toast('Video is not supported here. <button type="button">Share a picture</button>');
    t.querySelector('button').onclick = () => shareFile(file, blob, name);
  }, 'image/png');
}
async function shareFile(file, blob, name) {
  try { if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: 'Slingshot' }); $('#toast').hidden = true; return; } }
  catch (e) { if (e && e.name === 'AbortError') return; }
  const dl = window.claude ? await window.claude.use('downloads').catch(() => null) : null;
  if (dl) { try { await dl.save({ filename: name, data: blob }); toast('Saved', 2500); } catch (e) { if (!e || e.code !== 'declined') toast('Could not save the video.', 3500); } return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 60000); toast('Saved', 2500);
}
$('#clipBtn').onclick = makeClip;

/* ======================= loop ======================= */
let last = performance.now();
function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, Math.max(0.001, (now - last) / 1000)); last = now;
  if (document.hidden || CLIP) { Sound.hum(0); return; }
  S.time += dt;
  if (S.rewind) { renderGL(); draw(); if (S.time - S.rewind.t0 > 0.5) { S.rewind = null; load(S.idx); } return; }
  simulate(dt); renderGL(); draw();
  const hc = !S.won && S.comets[0];
  Sound.hum(hc && S.ffK < 2 ? Math.hypot(hc.vx, hc.vy) : 0);
  if (S.won && $('#winbar').hidden && S.time - S.wonAt > 1.1) {
    $('#winbar').hidden = false; $('#shareBtn').hidden = $('#clipBtn').hidden = !!S.replay; $('#speedBtn').hidden = true;
    $('#nextBtn').setAttribute('aria-label', S.replay ? 'Play this level' : 'Next level');
  }
  if (S.replay && !S.won && !S.comets.length && S.replay.throws.every(q => q.done)) load(S.idx);
}
window.addEventListener('resize', resize);
resize();
const m = /#r=([0-9a-z._~-]+)/.exec(location.hash), rp = m && parseReplay(m[1]);
if (rp && rp.throws.length) load(rp.idx, { throws: rp.throws });
else if (rp) load(rp.idx);
else if (/#today/.test(location.hash) && todayIdx() >= 0) load(todayIdx());
else load(Math.min(store.last || 0, (DAILY ? DAILY0 : ALL.length) - 1));
if (!gl) document.body.insertAdjacentHTML('beforeend', '<p style="position:fixed;bottom:40%;left:0;right:0;text-align:center">This game needs WebGL 2, which this browser has turned off.</p>');
if (ON_SITE && 'serviceWorker' in navigator) navigator.serviceWorker.register('/phone-sw.js', { scope: '/phone' }).catch(() => {});
requestAnimationFrame(loop);
</script>
