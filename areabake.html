<title>areabake</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Three living mathematical exhibits: reaction-diffusion, a gravity slingshot game and strange attractors, rendered on the GPU.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,300;1,400;1,500&family=Jost:wght@300;400;500&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one full-bleed GPU canvas per exhibit, with a museum placard top-left,
   an instrument panel top-right and a gallery switcher along the bottom edge. */
:root{
  color-scheme:dark;
  --ink:#07080d;          /* gallery wall */
  --paper:#ece5d6;        /* placard text */
  --mist:#9d9aa9;         /* secondary text, violet-grey */
  --line:rgba(236,229,214,.14);
  --glass:rgba(9,10,16,.62);
  --scrim:rgba(5,6,10,.78);
  --halo:rgba(5,6,10,.9);
  --accent:#8fe3cf;       /* set per exhibit */
  --display:"Cormorant Garamond","Cormorant",Garamond,"Times New Roman",serif;
  --body:"Jost","Futura","Century Gothic","Avenir Next",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --gut:max(16px,env(safe-area-inset-left,0px));
  --gutR:max(16px,env(safe-area-inset-right,0px));
}
/* Light exhibits (a porcelain or vellum palette) flip the placard to ink on paper. */
body[data-tone="light"]{
  --paper:#1b1d28; --mist:#5d5a68; --line:rgba(27,29,40,.16);
  --glass:rgba(246,242,233,.72); --scrim:rgba(244,240,231,.82); --halo:rgba(244,240,231,.95);
}
html,body{height:100%}
body{
  margin:0;background:var(--ink);color:var(--paper);font:300 15px/1.55 var(--body);
  overflow:hidden;-webkit-font-smoothing:antialiased;
  padding-left:var(--gut);padding-right:var(--gutR);
}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none;cursor:crosshair;touch-action:none}
#gl.grab{cursor:grab}#gl.grabbing{cursor:grabbing}
#gl{transition:opacity .26s ease}#gl.dim{opacity:0}
#orbit{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#gl.dim+#orbit{opacity:0}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.placard.rise>*{animation:rise .8s cubic-bezier(.2,.7,.2,1) both}
.placard.rise>:nth-child(2){animation-delay:.06s}.placard.rise>:nth-child(3){animation-delay:.14s}
.placard.rise>:nth-child(4){animation-delay:.2s}.placard.rise>:nth-child(5){animation-delay:.28s}
.ui{transition:opacity .5s ease}
body.bare .ui{opacity:0;pointer-events:none}

/* Placard */
.scrim{position:fixed;left:0;top:0;width:min(52rem,100vw);height:min(34rem,75vh);pointer-events:none;
  background:radial-gradient(ellipse at 0 0,var(--scrim) 0%,var(--scrim) 30%,transparent 72%);transition:background .6s}
.placard{position:fixed;top:calc(env(safe-area-inset-top,0px) + 22px);left:calc(var(--gut) + 8px);
  width:min(25rem,calc(100vw - 2*var(--gut) - 16px));pointer-events:none;display:grid;gap:10px}
.brand{display:flex;align-items:baseline;gap:10px;color:var(--mist)}
.brand .mark{font:500 15px/1 var(--body);letter-spacing:.06em;color:var(--paper)}
.brand .mark::after{content:"";display:inline-block;width:5px;height:5px;margin-left:3px;border-radius:50%;background:var(--accent);vertical-align:1px}
.brand .tag{font:400 italic 15px/1 var(--display);color:var(--mist)}
.placard h1{margin:4px 0 0;font:300 italic clamp(44px,6.4vw,76px)/.92 var(--display);letter-spacing:-.01em;text-wrap:balance}
.kicker{font:500 11px/1.2 var(--body);letter-spacing:.2em;text-transform:uppercase;color:var(--accent)}
.blurb{margin:0;max-width:24rem;color:var(--paper);opacity:.86;font-size:15px}
.placard:not(.open) .blurb{display:none}
.about{pointer-events:auto;justify-self:start;appearance:none;background:none;border:0;padding:2px 0;cursor:pointer;
  font:400 12.5px/1.2 var(--body);color:var(--mist);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:4px}
.about:hover{color:var(--paper)}
.eq{display:grid;gap:2px;margin-top:4px;font:400 italic 21px/1.35 var(--display);color:var(--paper)}
.eq span{white-space:nowrap}
.eq sub,.eq sup{font-size:.62em;line-height:0}
.eq .up{font-style:normal}
.eq .nabla{display:inline-block;width:.6em;height:.62em;margin:0 .04em 0 .1em;vertical-align:-.02em;transform:skewX(-14deg);overflow:visible}
.eq .nabla path{fill:none;stroke:currentColor;stroke-width:.75;stroke-linejoin:round}

/* Instrument panel */
.panel{position:fixed;top:calc(env(safe-area-inset-top,0px) + 18px);right:calc(var(--gutR) + 2px);width:272px;
  max-height:calc(100% - 140px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow:auto;
  background:var(--glass);-webkit-backdrop-filter:blur(16px) saturate(1.2);backdrop-filter:blur(16px) saturate(1.2);
  border:1px solid var(--line);border-radius:16px;padding:6px 16px 16px;scrollbar-width:thin}
.panel-head{appearance:none;background:none;border:0;width:100%;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:14px;padding:9px 0 5px;
  font:500 10.5px/1 var(--body);letter-spacing:.24em;text-transform:uppercase;color:var(--mist)}
.panel-head:hover{color:var(--paper)}
.panel-head svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:1.6;transition:transform .25s}
.panel.collapsed{width:auto;padding-bottom:5px}
.panel.collapsed #panelBody{display:none}
.panel.collapsed .panel-head svg{transform:rotate(180deg)}
details.more{border-top:1px solid var(--line)}
details.more>summary{list-style:none;cursor:pointer;padding:13px 0 9px;display:flex;justify-content:space-between;
  font:500 10.5px/1 var(--body);letter-spacing:.2em;text-transform:uppercase;color:var(--mist)}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::after{content:"+";font-size:15px;letter-spacing:0;line-height:.6}
details.more[open]>summary::after{content:"−"}
details.more>.grp:first-of-type{border-top:0;padding-top:4px}
.note.tip{color:var(--paper);opacity:.8}
.grp{display:grid;gap:9px;padding:13px 0 12px;border-top:1px solid var(--line)}
.grp:first-of-type{border-top:0}
.grp h3{margin:0;font:500 10.5px/1 var(--body);letter-spacing:.2em;text-transform:uppercase;color:var(--mist)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
button{font:inherit;color:inherit}
.chip,.ghost{appearance:none;border:1px solid var(--line);background:transparent;border-radius:999px;
  padding:5px 11px;font:400 13px/1.2 var(--body);cursor:pointer;color:var(--paper);transition:border-color .2s,background .2s,color .2s}
.chip:hover,.ghost:hover{border-color:color-mix(in srgb,var(--accent) 60%,transparent)}
.chip[aria-pressed="true"]{background:color-mix(in srgb,var(--accent) 18%,transparent);border-color:var(--accent);color:var(--paper)}
.chip .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:1px}
.ghost{border-style:dashed}
.row{display:flex;flex-wrap:wrap;gap:6px}
.sw{display:flex;gap:9px;flex-wrap:wrap}
.swatch{appearance:none;width:30px;height:30px;border-radius:50%;border:1px solid var(--line);cursor:pointer;padding:0;position:relative}
.swatch[aria-pressed="true"]{outline:1.5px solid var(--accent);outline-offset:3px}
.sl{display:grid;gap:4px}
.sl-top{display:flex;justify-content:space-between;align-items:baseline;font-size:13px}
.sl-val{font:400 12px/1 var(--mono);color:var(--accent);font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:22px;background:transparent;cursor:pointer;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:var(--line);border-radius:2px}
input[type=range]::-moz-range-track{height:2px;background:var(--line);border-radius:2px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--accent);margin-top:-6px;border:2px solid var(--ink);box-shadow:0 0 0 1px var(--accent)}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--accent);border:2px solid var(--ink)}
.note{margin:0;font-size:13.5px;line-height:1.5;color:var(--mist)}
.note b{font-weight:500;color:var(--paper)}
.read{font:400 12.5px/1.5 var(--mono);color:var(--paper);font-variant-numeric:tabular-nums}
.read em{font-style:normal;color:var(--accent)}
:focus-visible{outline:1.5px solid var(--accent);outline-offset:2px}

/* Gallery switcher */
.switcher{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 18px);
  display:flex;gap:2px;padding:5px;border-radius:999px;background:var(--glass);border:1px solid var(--line);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.switcher button{appearance:none;border:0;background:transparent;cursor:pointer;padding:7px 18px 8px;border-radius:999px;
  font:400 italic 21px/1 var(--display);color:var(--mist);transition:color .25s,background .25s}
.switcher button:hover{color:var(--paper)}
.switcher button[aria-current="true"]{color:var(--paper);background:color-mix(in srgb,var(--accent) 16%,transparent)}
.hint{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 78px);
  font:400 12px/1.3 var(--mono);color:var(--paper);white-space:nowrap;pointer-events:none;
  padding:6px 12px;border-radius:999px;background:var(--glass);border:1px solid var(--line);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);transition:opacity 1.2s}
.hint.gone{opacity:0}
.corner{position:fixed;right:calc(var(--gutR) + 2px);bottom:calc(env(safe-area-inset-bottom,0px) + 22px);display:flex;gap:6px}
.icon{appearance:none;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--glass);cursor:pointer;
  display:grid;place-items:center;color:var(--paper);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.icon svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.5}
#show{position:fixed;right:calc(var(--gutR) + 2px);bottom:calc(env(safe-area-inset-bottom,0px) + 22px);opacity:0;pointer-events:none;transition:opacity .5s}
body.bare #show{opacity:.55;pointer-events:auto}
body.bare #show:hover{opacity:1}
#panelToggle{display:none}


/* Slingshot's score line and level card */
.eyebrow{font:500 10.5px/1 var(--body);letter-spacing:.24em;text-transform:uppercase;color:var(--mist)}
.hud{position:fixed;top:calc(env(safe-area-inset-top,0px) + 20px);left:50%;transform:translateX(-50%);display:grid;gap:5px;justify-items:center;text-align:center;pointer-events:none}
.hud-main{font:300 italic 28px/1 var(--display);color:var(--paper)}
.hud-sub{font:400 12px/1.3 var(--mono);color:var(--mist);font-variant-numeric:tabular-nums}
.ff{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 96px);transform:translateX(-50%);display:flex;align-items:center;gap:10px;
  padding:7px 14px;border-radius:999px;background:var(--glass);border:1px solid color-mix(in srgb,var(--accent) 60%,transparent);
  font:400 12px/1 var(--mono);color:var(--paper);pointer-events:none;white-space:nowrap;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.ff-ch{display:flex;gap:1px}
.ff-ch i{width:0;height:0;border-left:7px solid var(--accent);border-top:5px solid transparent;border-bottom:5px solid transparent;animation:ffc .8s linear infinite}
.ff-ch i:nth-child(2){animation-delay:.13s}.ff-ch i:nth-child(3){animation-delay:.26s}
@keyframes ffc{0%,100%{opacity:.25}40%{opacity:1}}
.card{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);display:grid;gap:10px;justify-items:center;text-align:center;
  padding:24px 32px 22px;border-radius:18px;background:var(--glass);border:1px solid var(--line);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.card-title{font:300 italic 34px/1.05 var(--display)}
.card-stars{font-size:28px;letter-spacing:.2em;color:var(--accent)}
.card-sub{font-size:14px;color:var(--mist)}

/* How-to legend */
.legend{position:fixed;left:calc(var(--gut) + 6px);bottom:calc(env(safe-area-inset-bottom,0px) + 20px);display:grid;gap:6px;
  padding:10px 13px 11px;border-radius:12px;background:var(--glass);border:1px solid var(--line);max-width:min(23rem,calc(50vw - 190px));
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);font-size:12.5px;line-height:1.3;pointer-events:none}
.lg-title{font:500 10px/1 var(--body);letter-spacing:.22em;text-transform:uppercase;color:var(--mist);margin-bottom:2px}
.lg-row{display:flex;align-items:center;gap:10px}
.lg-ic{flex:none;width:14px;height:20px;display:grid;place-items:center}
.lg-ic svg{width:14px;height:20px;overflow:visible}
.lg-ic .o{fill:none;stroke:var(--paper);stroke-width:1.1;opacity:.75}
.lg-ic .f{fill:var(--accent);stroke:none}
.lg-t b{font-weight:500;color:var(--paper)}
.lg-t em{display:block;font-style:normal;color:var(--mist);font-size:11.5px}
kbd{font:400 11px/1 var(--mono);padding:2px 5px;border:1px solid var(--line);border-radius:4px;color:var(--paper)}
.hint.coach{border-color:color-mix(in srgb,var(--accent) 70%,transparent);padding-left:26px}
.hint.coach::before{content:"";position:absolute;left:11px;top:50%;width:7px;height:7px;margin-top:-3.5px;border-radius:50%;background:var(--accent);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25;transform:scale(.7)}}

/* Morphogen's parameter-map axes */
.axes{position:fixed;inset:0;pointer-events:none;font:400 11px/1 var(--mono);color:var(--paper)}
.axes span{position:absolute;padding:4px 7px;border-radius:6px;background:var(--glass);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.ax-k{left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 120px)}
.ax-f{left:calc(var(--gut) + 6px);bottom:calc(env(safe-area-inset-bottom,0px) + 170px)}
.probe{position:fixed;pointer-events:none;font:400 11.5px/1.3 var(--mono);color:var(--paper);padding:4px 7px;border-radius:6px;
  background:var(--glass);border:1px solid var(--line);transform:translate(14px,14px);white-space:nowrap}

.fail{position:fixed;inset:0;display:grid;place-items:center;text-align:center;padding:24px;font-size:16px;color:var(--paper)}

@media (max-width:760px){
  .placard{gap:6px;top:calc(env(safe-area-inset-top,0px) + 14px)}
  .placard h1{font-size:44px}
  .eq{font-size:17px}
  .scrim{height:min(22rem,55vh)}
  #panelToggle{display:grid}
  .panel{top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 74px);right:var(--gutR);left:var(--gut);width:auto;
    max-height:52vh;transform:translateY(calc(100% + 120px));transition:transform .35s ease}
  .panel.open{transform:none}
  .switcher{left:var(--gut);transform:none;bottom:calc(env(safe-area-inset-bottom,0px) + 16px)}
  .switcher button{padding:7px 11px 8px;font-size:18px}
  .corner{bottom:calc(env(safe-area-inset-bottom,0px) + 18px)}
  .hint{bottom:calc(env(safe-area-inset-bottom,0px) + 70px);left:var(--gut);transform:none;white-space:normal;max-width:calc(100vw - 2*var(--gut))}
  .ax-k{bottom:calc(env(safe-area-inset-bottom,0px) + 112px)}
  .legend{display:none}
  .panel.collapsed #panelBody{display:block}
  .panel.collapsed{width:auto}
  .hud{top:calc(env(safe-area-inset-top,0px) + 118px)}
  .hud-main{font-size:22px}
  .ff{top:calc(env(safe-area-inset-top,0px) + 182px)}
  .ax-f{bottom:calc(env(safe-area-inset-bottom,0px) + 146px)}
}
@media (max-width:420px){.switcher button{padding:7px 8px 8px;font-size:17px}}
@media (prefers-reduced-motion:reduce){.ui,.panel,.hint,#gl{transition:none}.placard.rise>*,.hint.coach::before{animation:none}}
</style>

<canvas id="gl" tabindex="0" aria-label="Interactive mathematical artwork"></canvas>
<canvas id="orbit" aria-hidden="true"></canvas>

<div class="ui">
  <div class="scrim"></div>
  <header class="placard" id="placard">
    <div class="brand"><span class="mark">areabake</span><span class="tag">fresh math, baked on your GPU</span></div>
    <h1 id="title">Morphogen</h1>
    <div class="kicker" id="kicker"></div>
    <p class="blurb" id="blurb"></p>
    <div class="eq" id="eq"></div>
    <button class="about" id="about" type="button" aria-expanded="false">About this piece</button>
  </header>

  <aside class="panel" id="panel" aria-label="Controls">
    <button class="panel-head" id="panelHead" type="button" aria-expanded="true"><span>Controls</span><svg viewBox="0 0 12 12"><path d="M2.5 7.5 6 4l3.5 3.5"/></svg></button>
    <div id="panelBody"></div>
  </aside>

  <div class="hud" id="hud" hidden aria-live="polite"></div>
  <div class="ff" id="ff" hidden><span class="ff-ch" aria-hidden="true"><i></i><i></i><i></i></span><span>Fast-forward</span></div>
  <div class="card" id="card" hidden role="dialog" aria-labelledby="card-title">
    <div class="eyebrow">Level complete</div>
    <div class="card-title" id="card-title"></div>
    <div class="card-stars" id="card-stars" aria-hidden="true"></div>
    <div class="card-sub" id="card-sub"></div>
    <div class="row"><button class="chip" id="card-retry" type="button">Play again</button><button class="chip" id="card-next" type="button" aria-pressed="true">Next level</button></div>
  </div>
  <div class="legend" id="legend" aria-label="How to use this exhibit"></div>

  <div class="axes" id="axes" hidden>
    <span class="ax-k">kill rate k &nbsp;0.045 → 0.070</span>
    <span class="ax-f">feed rate f &nbsp;0.010 → 0.090 ↑</span>
  </div>
  <div class="probe" id="probe" hidden></div>

  <div class="hint" id="hint"></div>

  <nav class="switcher" id="switcher" aria-label="Exhibits">
    <button type="button" data-x="morphogen">Morphogen</button>
    <button type="button" data-x="slingshot">Slingshot</button>
    <button type="button" data-x="attractor">Attractor</button>
  </nav>

  <div class="corner">
    <button class="icon" id="panelToggle" type="button" aria-label="Show controls" aria-expanded="false">
      <svg viewBox="0 0 16 16"><path d="M2 4h12M2 8h12M2 12h12"/><circle cx="5" cy="4" r="1.6" fill="currentColor"/><circle cx="11" cy="8" r="1.6" fill="currentColor"/><circle cx="7" cy="12" r="1.6" fill="currentColor"/></svg>
    </button>
    <button class="icon" id="hide" type="button" aria-label="Hide interface (H)" title="Hide interface (H)">
      <svg viewBox="0 0 16 16"><path d="M1.5 8s2.4-4.5 6.5-4.5S14.5 8 14.5 8s-2.4 4.5-6.5 4.5S1.5 8 1.5 8z"/><circle cx="8" cy="8" r="2"/></svg>
    </button>
  </div>
</div>
<button class="icon" id="show" type="button" aria-label="Show interface (H)" title="Show interface (H)">
  <svg viewBox="0 0 16 16"><path d="M1.5 8s2.4-4.5 6.5-4.5S14.5 8 14.5 8s-2.4 4.5-6.5 4.5S1.5 8 1.5 8z"/><circle cx="8" cy="8" r="2"/></svg>
</button>

<script>
'use strict';
const $ = s => document.querySelector(s);
const el = (tag, cls) => { const e = document.createElement(tag); if (cls) e.className = cls; return e; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16) / 255);
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const TOUCH = matchMedia('(pointer: coarse)').matches;

const canvas = $('#gl');
const gl = canvas.getContext('webgl2', { antialias: false, alpha: false, depth: false, stencil: false, premultipliedAlpha: false, powerPreference: 'high-performance' });
if (!gl) {
  document.body.insertAdjacentHTML('beforeend', '<div class="fail">areabake bakes its images with WebGL 2, which this browser has turned off. Try a recent Chrome, Firefox, Safari or Edge.</div>');
  throw new Error('WebGL2 unavailable');
}
const HAS_FLOAT = !!gl.getExtension('EXT_color_buffer_float');
const HAS_HALF = HAS_FLOAT || !!gl.getExtension('EXT_color_buffer_half_float');
gl.getExtension('OES_texture_float_linear');

/* ---------- GL plumbing ---------- */
function shader(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    const log = gl.getShaderInfoLog(s);
    console.error(log + '\n' + src.split('\n').map((l, i) => (i + 1) + ': ' + l).join('\n'));
    throw new Error(log);
  }
  return s;
}
function program(vs, fs, varyings) {
  const p = gl.createProgram();
  gl.attachShader(p, shader(gl.VERTEX_SHADER, vs));
  gl.attachShader(p, shader(gl.FRAGMENT_SHADER, fs));
  if (varyings) gl.transformFeedbackVaryings(p, varyings, gl.INTERLEAVED_ATTRIBS);
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));

const SL = (() => {
  const EPS2 = 0.0004, DT = 1 / 600, LIFE = 24, PULL = 0.75, SPEED = 2.6, TR = 0.07;
  const LEVELS = [
    { id: 'bend', name: 'Bend it', par: 1, launch: [-1.25, -0.3],
      bodies: [{ x: 0.15, y: 0, m: 0.28, r: 0.075 }], targets: [[1.15, 0.3]],
      tip: 'A straight line runs into the star. Throw wide and let gravity bend the path.' },
    { id: 'twins', name: 'Two suns', par: 2, launch: [0, -0.92],
      bodies: [{ x: -0.5, y: 0, m: 0.2, r: 0.065 }, { x: 0.5, y: 0, m: 0.2, r: 0.065 }], targets: [[0, 0.55], [-1.05, 0], [1.05, 0]],
      tip: 'Between two suns the pull cancels out. Around the outside, it adds up.' },
    { id: 'keyhole', name: 'The keyhole', par: 2, launch: [-1.3, 0],
      bodies: [{ x: 0, y: 0.17, m: 0.36, r: 0.065 }, { x: 0, y: -0.17, m: 0.14, r: 0.05 }], targets: [[0.55, 0.05], [1.25, 0.1]],
      tip: 'The gap is narrow and the two stars are not equal. The heavy one pulls harder.' },
    { id: 'lap', name: 'One lap', par: 2, launch: [0.1, -0.58],
      bodies: [{ x: 0.1, y: 0, m: 0.3, r: 0.08 }], targets: [[0.68, 0], [0.1, 0.58], [-0.48, 0]],
      tip: 'Throw sideways at just the right speed and the comet falls around the star forever.' },
    { id: 'eight', name: 'Figure eight', par: 1, launch: [0, -0.62],
      bodies: [{ x: -0.45, y: 0, m: 0.18, r: 0.06 }, { x: 0.45, y: 0, m: 0.18, r: 0.06 }], targets: [[-0.95, 0], [0.95, 0], [0, 0.62]],
      tip: 'One throw, all three. Loop around one sun, cross over, and loop around the other.' },
    { id: 'moon', name: 'Moonshot', par: 2, launch: [-1.3, -0.75],
      bodies: [{ x: -0.15, y: 0, m: 0.25, r: 0.075 }, { m: 0.1, r: 0.04, orbit: { cx: -0.15, cy: 0, R: 0.62, period: 7, phase: 0 } }],
      targets: [[1.35, 0.6], [-0.15, 0.98]],
      tip: 'The moon moves. Time your throw so it tugs the comet where you want it.' },
    { id: 'trio', name: 'Three body', par: 3, launch: [-1.35, -0.8],
      bodies: [{ x: -0.6, y: 0.32, m: 0.16, r: 0.055 }, { x: 0.62, y: 0.3, m: 0.16, r: 0.055 }, { x: 0.02, y: -0.5, m: 0.16, r: 0.055 }],
      targets: [[0, 0.05], [1.3, -0.55], [0.02, 0.85], [-1.15, 0.45], [0.75, -0.9]],
      tip: 'Three stars, no simple orbits. Use the near misses.' },
  ];
  function bodyPos(b, t) {
    if (!b.orbit) return [b.x, b.y];
    const o = b.orbit, a = o.phase + t / o.period * Math.PI * 2;
    return [o.cx + o.R * Math.cos(a), o.cy + o.R * Math.sin(a)];
  }
  // gravitational acceleration at (x, y) at time t; returns [ax, ay, hit] where hit is the body struck
  function accel(bodies, x, y, t, out) {
    let ax = 0, ay = 0, hit = -1;
    for (let i = 0; i < bodies.length; i++) {
      const b = bodies[i], p = b.orbit ? bodyPos(b, t) : [b.x, b.y];
      const dx = p[0] - x, dy = p[1] - y, r2 = dx * dx + dy * dy;
      if (r2 < b.r * b.r) hit = i;
      const inv = b.m / Math.pow(r2 + EPS2, 1.5);
      ax += dx * inv; ay += dy * inv;
    }
    out[0] = ax; out[1] = ay; out[2] = hit;
    return out;
  }
  function launchVel(launch, px, py) {
    // pulling back from the launcher throws the comet the other way
    let dx = launch[0] - px, dy = launch[1] - py;
    const l = Math.hypot(dx, dy); if (l > PULL) { dx *= PULL / l; dy *= PULL / l; }
    return [dx * SPEED, dy * SPEED];
  }
  // leapfrog (kick-drift-kick): symplectic, so orbits keep their energy and close on themselves
  function makeComet(x, y, vx, vy, t0) {
    return { x, y, vx, vy, t: t0, age: 0, alive: true, a: [0, 0, -1], trail: [[x, y]], fate: null };
  }
  function stepComet(c, bodies, dt) {
    const a = c.a;
    accel(bodies, c.x, c.y, c.t, a);
    c.vx += a[0] * dt * 0.5; c.vy += a[1] * dt * 0.5;
    c.x += c.vx * dt; c.y += c.vy * dt; c.t += dt; c.age += dt;
    accel(bodies, c.x, c.y, c.t, a);
    c.vx += a[0] * dt * 0.5; c.vy += a[1] * dt * 0.5;
    if (a[2] >= 0) { c.alive = false; c.fate = 'crash'; }
  }
  function hits(c, targets, got) {
    let n = 0;
    for (let i = 0; i < targets.length; i++) {
      if (got[i]) continue;
      const dx = targets[i][0] - c.x, dy = targets[i][1] - c.y;
      if (dx * dx + dy * dy < TR * TR) { got[i] = true; n++; }
    }
    return n;
  }
  return { LEVELS, DT, LIFE, PULL, SPEED, TR, bodyPos, accel, launchVel, makeComet, stepComet, hits };
})();

const Sound = {
  ctx: null, on: true,
  wake() {
    if (!this.ctx) { try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { this.ctx = null; } }
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
  },
  tone(freq, dur = 0.7, type = 'sine', gain = 0.08, when = 0) {
    if (!this.on || !this.ctx) return;
    const t = this.ctx.currentTime + when, o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(gain, t + 0.012); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(this.ctx.destination); o.start(t); o.stop(t + dur + 0.05);
  },
  whoosh(power) {
    if (!this.on || !this.ctx) return;
    const c = this.ctx, t = c.currentTime, n = Math.floor(c.sampleRate * 0.45), buf = c.createBuffer(1, n, c.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2);
    const src = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    src.buffer = buf; f.type = 'bandpass'; f.Q.value = 1.4;
    f.frequency.setValueAtTime(300 + 900 * power, t); f.frequency.exponentialRampToValueAtTime(140, t + 0.45);
    g.gain.value = 0.05 + 0.08 * power;
    src.connect(f).connect(g).connect(c.destination); src.start(t);
  },
  chime(i) { const s = [523.25, 659.25, 783.99, 880, 1046.5, 1174.66, 1318.5]; const f = s[i % s.length]; this.tone(f, 1.2, 'sine', 0.07); this.tone(f * 2, 0.6, 'sine', 0.025); },
  thud() { this.tone(70, 0.5, 'sine', 0.14); this.tone(140, 0.25, 'triangle', 0.04); },
  fanfare() { [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => { this.tone(f, 1.4, 'sine', 0.06, i * 0.11); this.tone(f / 2, 1.4, 'triangle', 0.02, i * 0.11); }); },
};

function Slingshot() {
  const C = SL, LV = SL.LEVELS;
  const S = {
    mode: 'level', li: 0, shots: 0, got: [], comets: [], ghosts: [], sparks: [], t: 0, acc: 0, speed: 1, won: false,
    assist: 'short', aim: null, hover: null, drag: null, best: {}, burst: [], dust: [], waves: [], ff: false, ffK: 1, ffWhy: '',

  };
  try { S.best = JSON.parse(localStorage.getItem('areabake.slingshot') || '{}') || {}; } catch (e) { S.best = {}; }

  const FS = `#version 300 es
  precision highp float; precision highp int;
  uniform vec2 u_center; uniform float u_scale; uniform int u_n, u_rot; uniform vec4 u_b[12]; uniform float u_kind[12];
  uniform vec3 u_acc; uniform float u_time;
  out vec4 o;
  float h21(vec2 p){ p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
  float vnoise(vec2 p){ vec2 i = floor(p), f = fract(p); f = f*f*(3.0 - 2.0*f);
    return mix(mix(h21(i), h21(i + vec2(1,0)), f.x), mix(h21(i + vec2(0,1)), h21(i + vec2(1,1)), f.x), f.y); }

    return mix(mix(orange, yellow, smoothstep(0.06, 0.18, m)), blue, smoothstep(0.24, 0.42, m));
  }
  void main(){
    vec2 q = (gl_FragCoord.xy - u_center) / u_scale;
    vec2 p = u_rot == 1 ? vec2(q.y, -q.x) : q;
    vec3 col = vec3(0.010, 0.011, 0.024);
    vec2 cell = floor(gl_FragCoord.xy / 3.0); float s = h21(cell);
    if (s > 0.995) col += vec3(0.55, 0.6, 0.8) * (s - 0.995) * 60.0 * (0.6 + 0.4 * sin(u_time * 1.3 + s * 900.0));
    // slow nebula clouds behind everything
    float nb = fbm(p * 1.25 + vec2(0.0, u_time * 0.004)), nb2 = fbm(p * 2.4 - vec2(u_time * 0.006, 3.1));
    col += mix(u_acc, vec3(0.86, 0.42, 0.72), nb2) * pow(smoothstep(0.36, 0.95, nb), 2.0) * 0.13;
    float phi = 0.0; vec3 light = vec3(0.0);
    for (int i = 0; i < 12; i++) {
      if (i >= u_n) break;
      vec4 b = u_b[i]; vec2 d = p - b.xy; float r = length(d);
      phi += b.z / sqrt(r * r + 0.0004);
      float core = 1.0 - smoothstep(b.w * 0.82, b.w, r);
      if (u_kind[i] > 0.5) {
        // a moon: a shaded sphere with a thin atmosphere
        float sh = sqrt(max(0.0, 1.0 - r * r / (b.w * b.w)));
        float lit = clamp(dot(normalize(vec3(-d / b.w, sh) + 1e-5), normalize(vec3(-b.xy, 0.6))), 0.0, 1.0);
        light += vec3(0.5, 0.68, 0.95) * core * (0.12 + 0.9 * lit) + vec3(0.45, 0.7, 1.0) * exp(-max(r - b.w, 0.0) / (b.w * 0.35)) * 0.25 * (1.0 - core);

      vec3 sc = starCol(b.z);
      float ang = atan(d.y, d.x);

      float halo = exp(-max(r - b.w, 0.0) / (b.w * 0.8)) * 0.6 * rays + 0.006 * b.z / (r * r + 0.004);

    float v = log(phi + 0.02) * 4.5;
    float fw = max(fwidth(v), 1e-4);
    float dl = abs(fract(v + 0.5) - 0.5) / fw;

    const rot = cssW < cssH * 0.9;

  const level = () => LV[S.li];
  function bodies() { return S.mode === 'level' ? level().bodies : S.sb.stars; }

  }

  x.enter();

  if (x.legendRows) legend(x.legendRows);
  const pl = $('#placard'); pl.classList.remove('rise'); void pl.offsetWidth; pl.classList.add('rise');
  document.querySelectorAll('#switcher button').forEach(b => b.setAttribute('aria-current', String(b.dataset.x === x.id)));

document.querySelectorAll('#switcher button').forEach(b => b.onclick = () => show(b.dataset.x));

function setBare(v) { document.body.classList.toggle('bare', v); }
$('#hide').onclick = () => setBare(true);
$('#show').onclick = () => setBare(false);

};

window.addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('input,textarea')) return;

window.addEventListener('resize', resize);
canvas.addEventListener('webglcontextlost', e => { e.preventDefault(); hint('The graphics context was lost. Reload the page to bake it again.'); });

let last = performance.now(), failed = false;
function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, Math.max(0.001, (now - last) / 1000)); last = now;
  if (!current || document.hidden || window.__areabake.paused) return;

resize();
window.__areabake = { exhibits, show: id => swap(exhibits[id]) };
show((location.hash || '').slice(1) || 'morphogen');
