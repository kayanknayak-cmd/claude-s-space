<title>Slingshot</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="A gravity game for your phone. Throw a comet past stars and moons and collect every target.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,300;1,400;1,500&family=Jost:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a portrait arena that fills the phone, a thin top bar with the two
   controls you need mid-level, and full-screen sheets for everything else. */
:root{
  color-scheme:dark;
  --ink:#05060c; --paper:#efe8da; --mist:#9b98aa; --line:rgba(239,232,218,.14);
  --glass:rgba(8,9,16,.72); --accent:#9ad7ff; --hot:#ffd36e;
  --display:"Cormorant Garamond",Garamond,"Times New Roman",serif;
  --body:"Jost","Avenir Next","Futura",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --top:env(safe-area-inset-top,0px); --bot:env(safe-area-inset-bottom,0px);
}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--paper);font:400 16px/1.4 var(--body);overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;overscroll-behavior:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#fx{pointer-events:none}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

/* top bar */
.bar{position:fixed;left:0;right:0;top:0;padding:calc(var(--top) + 10px) max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px));
  display:grid;grid-template-columns:56px 1fr 56px;align-items:center;gap:8px;pointer-events:none}
.bar>*{pointer-events:auto}
.round{appearance:none;width:52px;height:52px;border-radius:50%;border:1px solid var(--line);background:var(--glass);
  display:grid;place-items:center;cursor:pointer;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.round:active{transform:scale(.94)}
.round svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.mid{display:grid;justify-items:center;gap:6px;pointer-events:none;text-align:center;min-width:0}
.lvname{font:400 italic 22px/1 var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.pips{display:flex;gap:7px;align-items:center}
.pip{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--pc,var(--accent));opacity:.85}
.pip.on{background:var(--pc,var(--accent));box-shadow:0 0 10px var(--pc,var(--accent))}
.shots{font:400 12px/1 var(--mono);color:var(--mist);margin-left:4px}
.corner{position:fixed;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(var(--bot) + 16px);display:flex;gap:10px}
.speed{width:auto;padding:0 16px;border-radius:26px;font:500 15px/1 var(--mono);gap:6px;display:flex;align-items:center}
.skip{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--bot) + 22px);appearance:none;border:1px solid var(--line);
  background:var(--glass);border-radius:22px;padding:11px 18px;font-size:15px;cursor:pointer;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.ff{position:fixed;left:50%;top:calc(var(--top) + 78px);transform:translateX(-50%);display:flex;gap:2px;pointer-events:none}
.ff i{width:0;height:0;border-left:9px solid var(--accent);border-top:6px solid transparent;border-bottom:6px solid transparent;animation:ffc .8s linear infinite}
.ff i:nth-child(2){animation-delay:.13s}.ff i:nth-child(3){animation-delay:.26s}
@keyframes ffc{0%,100%{opacity:.2}40%{opacity:1}}
.replay{position:fixed;left:50%;top:calc(var(--top) + 76px);transform:translateX(-50%);font:500 11px/1 var(--body);letter-spacing:.22em;text-transform:uppercase;
  color:var(--hot);padding:7px 12px;border-radius:14px;border:1px solid rgba(255,211,110,.4);background:var(--glass)}

/* sheets */
.sheet{position:fixed;inset:0;background:rgba(4,5,10,.82);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
  overflow-y:auto;padding:calc(var(--top) + 18px) max(18px,env(safe-area-inset-right,0px)) calc(var(--bot) + 28px) max(18px,env(safe-area-inset-left,0px));
  animation:fade .25s ease both;touch-action:pan-y}
@keyframes fade{from{opacity:0}}
.sheet-in{max-width:30rem;margin:0 auto;display:grid;gap:22px}
.sh-head{display:flex;justify-content:space-between;align-items:center}
.brand{font:500 14px/1 var(--body);letter-spacing:.06em;color:var(--mist)}
.brand b{color:var(--paper);font-weight:500}
h1{margin:0;font:300 italic 54px/1 var(--display)}
h2{margin:0 0 10px;font:500 11px/1 var(--body);letter-spacing:.24em;text-transform:uppercase;color:var(--mist);display:flex;justify-content:space-between}
h2 span{letter-spacing:0;text-transform:none;font-family:var(--mono)}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.tile{appearance:none;aspect-ratio:1;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.03);cursor:pointer;
  display:grid;place-items:center;align-content:center;gap:3px;font:500 19px/1 var(--mono)}
.tile small{font:400 10px/1 var(--body);letter-spacing:.08em;color:var(--hot)}
.today{appearance:none;width:100%;min-height:64px;padding:0 20px;border-radius:18px;border:1px solid color-mix(in srgb,var(--dc) 45%,transparent);
  background:linear-gradient(100deg,color-mix(in srgb,var(--dc) 14%,transparent),rgba(255,255,255,.02));cursor:pointer;color:inherit;
  display:flex;align-items:center;justify-content:space-between;font:400 italic 22px/1 var(--display,serif)}
.today small{font:400 12px/1 var(--mono);font-style:normal;color:var(--hot)}
.tile.cur{border-color:var(--wc,var(--accent));box-shadow:inset 0 0 0 1px var(--wc,var(--accent))}
.tile:disabled{opacity:.3;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:10px}
.pill{appearance:none;min-height:46px;padding:0 18px;border-radius:23px;border:1px solid var(--line);background:rgba(255,255,255,.03);cursor:pointer;font-size:15px}
.pill[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,transparent)}
.big{appearance:none;width:100%;min-height:58px;border-radius:29px;border:0;background:var(--accent);color:#08101a;font:500 18px/1 var(--body);cursor:pointer}
.ghost{appearance:none;min-height:52px;flex:1;border-radius:26px;border:1px solid var(--line);background:rgba(255,255,255,.04);font-size:16px;cursor:pointer}
.muted{color:var(--mist);font-size:14px;margin:0}
a{color:var(--accent)}


.lvname,.pips{transition:opacity .5s ease}
body.titling .lvname,body.titling .pips{opacity:0}
/* after a win: a row of quiet icons instead of a panel */
.winbar{position:fixed;left:0;right:0;bottom:calc(var(--bot) + 22px);display:flex;justify-content:center;align-items:center;gap:16px;animation:fade .5s ease both}
.winbar .round{width:56px;height:56px}
.winbar .go{width:72px;height:72px;background:var(--accent);color:#07101a;border:0}
.winbar .go svg{width:28px;height:28px;stroke-width:2.2}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--bot) + 110px);font:400 13px/1.35 var(--mono);color:var(--paper);
  padding:8px 14px;border-radius:16px;background:var(--glass);border:1px solid var(--line);text-align:center;max-width:calc(100vw - 40px);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.toast button{appearance:none;border:0;background:none;color:var(--accent);font:inherit;text-decoration:underline;padding:4px;cursor:pointer}
.hintb{position:fixed;left:max(14px,env(safe-area-inset-left,0px));bottom:calc(var(--bot) + 16px)}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.ff i{animation:none}}
</style>

<canvas id="gl" aria-label="Slingshot playfield"></canvas>
<canvas id="fx" aria-hidden="true"></canvas>

<div class="bar">
  <button class="round" id="menuBtn" type="button" aria-label="Levels and settings">
    <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>
  <div class="mid"><div class="lvname" id="lvname"></div><div class="pips" id="pips"></div></div>
  <button class="round" id="restartBtn" type="button" aria-label="Restart level">
    <svg viewBox="0 0 24 24"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3"/><path d="M4 4.5v4.2h4.2"/></svg>
  </button>
</div>
<div class="ff" id="ff" hidden aria-label="Fast-forward"><i></i><i></i><i></i></div>
<div class="replay" id="replayTag" hidden>Replay</div>
<button class="skip" id="skipBtn" type="button" hidden>Skip this level</button>
<div class="corner"><button class="round speed" id="speedBtn" type="button" aria-label="Speed of time">1×</button></div>
<button class="round hintb" id="hintBtn" type="button" hidden aria-label="Show me a throw that works">
  <svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.6.5 1 1.2 1 2V16h5.2v-.2c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z"/></svg>
</button>
<div class="winbar" id="winbar" hidden>
  <button class="round" id="retryBtn" type="button" aria-label="Play again"><svg viewBox="0 0 24 24"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3"/><path d="M4 4.5v4.2h4.2"/></svg></button>
  <button class="round" id="shareBtn" type="button" aria-label="Share a replay link"><svg viewBox="0 0 24 24"><path d="M10 14a4.5 4.5 0 0 0 6.4 0l3-3a4.5 4.5 0 0 0-6.4-6.4l-1 1"/><path d="M14 10a4.5 4.5 0 0 0-6.4 0l-3 3a4.5 4.5 0 0 0 6.4 6.4l1-1"/></svg></button>
  <button class="round" id="clipBtn" type="button" aria-label="Save a video of this run"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="M16 10.5l5-3v9l-5-3z"/></svg></button>
  <button class="round go" id="nextBtn" type="button" aria-label="Next level"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
</div>
<div class="toast" id="toast" hidden aria-live="polite"></div>

<div class="sheet" id="menu" hidden role="dialog" aria-label="Levels">
  <div class="sheet-in">
    <div class="sh-head"><span class="brand"><b>areabake</b> · slingshot</span>
      <button class="round" id="closeMenu" type="button" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <h1>Slingshot</h1>
    <div id="worlds" style="display:grid;gap:24px"></div>
    <div><h2>Sound</h2><div class="row" id="soundRow"></div></div>
    <p class="muted">Drag back anywhere and let go. Comets never stop on their own: a bad throw can still loop around and score. Loops, close shaves and long flights earn trick points. After a win, the film button saves a video of your run.</p>
    <p class="muted"><a href="https://areabake.com/" target="_blank" rel="noopener">More from areabake</a></p>
  </div>
</div>
